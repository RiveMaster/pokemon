name: Pokemon genetics breeding and mega evolution tests

on:
  push:
    paths:
      - "src/Proyecto/**"
      - "tests/SistemaCrianzaMegaSmokeTest.java"
      - "tests/ExploradorMapaSmokeTest.java"
      - "tests/ArteEdificiosSmokeTest.java"
      - "tests/Animaciones2DSmokeTest.java"
      - "tests/InteraccionesGraficasSmokeTest.java"
      - "tests/ArteVisualRetroSmokeTest.java"
      - "tests/GeneracionesMapasSmokeTest.java"
      - "tests/ChatVpnSmokeTest.java"
      - "tests/SpritesExternosSmokeTest.java"
      - "tests/TerrenosConVecinosSmokeTest.java"
      - "tests/AtlasUsuarioFase1SmokeTest.java"
      - "tests/AtlasUsuarioFase2SmokeTest.java"
      - "Tiles/AtlasUsuarioInteriorFase2.png"
      - "Tiles/AtlasUsuarioFase1.png"
      - "Tiles/AtlasUsuario.png"
      - "Tiles/RPGPixelPack/**"
      - "Tiles/VisualRetro.png"
      - ".github/workflows/pokemon-genetics-mega.yml"
  pull_request:
    paths:
      - "src/Proyecto/**"
      - "tests/SistemaCrianzaMegaSmokeTest.java"
      - "tests/ExploradorMapaSmokeTest.java"
      - "tests/ArteEdificiosSmokeTest.java"
      - "tests/Animaciones2DSmokeTest.java"
      - "tests/InteraccionesGraficasSmokeTest.java"
      - "tests/ArteVisualRetroSmokeTest.java"
      - "tests/GeneracionesMapasSmokeTest.java"
      - "tests/ChatVpnSmokeTest.java"
      - "tests/SpritesExternosSmokeTest.java"
      - "tests/TerrenosConVecinosSmokeTest.java"
      - "tests/AtlasUsuarioFase1SmokeTest.java"
      - "tests/AtlasUsuarioFase2SmokeTest.java"
      - "Tiles/AtlasUsuarioInteriorFase2.png"
      - "Tiles/AtlasUsuarioFase1.png"
      - "Tiles/AtlasUsuario.png"
      - "Tiles/RPGPixelPack/**"
      - "Tiles/VisualRetro.png"
      - ".github/workflows/pokemon-genetics-mega.yml"

jobs:
  compile-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Compile all game and Studio sources
        run: |
          mkdir -p build
          find src -name '*.java' -print0 | xargs -0 javac --release 17 -encoding UTF-8 -d build
          javac --release 17 -encoding UTF-8 -cp build -d build tests/SistemaCrianzaMegaSmokeTest.java tests/ExploradorMapaSmokeTest.java tests/ArteEdificiosSmokeTest.java tests/Animaciones2DSmokeTest.java tests/InteraccionesGraficasSmokeTest.java tests/ArteVisualRetroSmokeTest.java tests/GeneracionesMapasSmokeTest.java tests/ChatVpnSmokeTest.java tests/SpritesExternosSmokeTest.java tests/TerrenosConVecinosSmokeTest.java tests/AtlasUsuarioFase1SmokeTest.java tests/AtlasUsuarioFase2SmokeTest.java
      - name: Test breeding, IVs, cooldown and mega evolution
        run: java -ea -cp build Proyecto.SistemaCrianzaMegaSmokeTest
      - name: Test WASD exploration movement rules
        run: java -ea -cp build Proyecto.ExploradorMapaSmokeTest
      - name: Test pixel-art buildings and reachable entrances
        run: java -ea -Djava.awt.headless=true -cp build Proyecto.ArteEdificiosSmokeTest
      - name: Test player sprites and walk animation frames
        run: java -ea -Djava.awt.headless=true -cp build Proyecto.Animaciones2DSmokeTest
      - name: Test graphical interactions and inventory item usage
        run: java -ea -Djava.awt.headless=true -cp build Proyecto.InteraccionesGraficasSmokeTest
      - name: Test integrated visual pack and battle scene
        run: java -ea -Djava.awt.headless=true -cp build Proyecto.ArteVisualRetroSmokeTest
      - name: Verify 100 distinct regional maps and walking routes
        run: java -ea -Djava.awt.headless=true -cp build Proyecto.GeneracionesMapasSmokeTest
      - name: Comprobar los 11 atlas de sprites CC0
        run: java -ea -Djava.awt.headless=true -cp build Proyecto.SpritesExternosSmokeTest
      - name: Comprobar claros, cornisas y árboles según vecinos
        run: java -ea -Djava.awt.headless=true -cp build Proyecto.TerrenosConVecinosSmokeTest
      - name: Probar el atlas exclusivo del usuario y las puertas del pueblo
        run: java -ea -Djava.awt.headless=true -cp build Proyecto.AtlasUsuarioFase1SmokeTest
      - name: Probar los tres interiores usando únicamente los sprites del usuario
        run: java -ea -Djava.awt.headless=true -cp build Proyecto.AtlasUsuarioFase2SmokeTest
      - name: Probar chat TCP y VPN con conexión de loopback
        run: java -ea -Djava.awt.headless=true -cp build Proyecto.ChatVpnSmokeTest
      - name: Exportar 100 mapas originales en PNG (10 por generación)
        run: java -Djava.awt.headless=true -cp build Proyecto.ExportadorMapasGeneracionales
      - name: Publicar los 100 mapas y 10 galerías
        uses: actions/upload-artifact@v4
        with:
          name: mapas-2d-100-generaciones
          path: MapasGenerados/
          if-no-files-found: error
          retention-days: 30
